<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Claude + HeyGen — Unlimited AI Video Studio</title>
    <script src="vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #14110d;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #14110d;
      }
      /* Sub-comp slots stretch to fill the root. */
      #root > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="33"
    >
      <div
        id="el-hook"
        data-composition-id="01-hook"
        data-composition-src="compositions/01-hook.html"
        data-start="0"
        data-duration="4.5"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="el-problem"
        data-composition-id="02-problem"
        data-composition-src="compositions/02-problem.html"
        data-start="4.5"
        data-duration="5"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="el-solution"
        data-composition-id="03-solution"
        data-composition-src="compositions/03-solution.html"
        data-start="9.5"
        data-duration="5"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="el-how"
        data-composition-id="04-how-it-works"
        data-composition-src="compositions/04-how-it-works.html"
        data-start="14.5"
        data-duration="9"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="el-benefit"
        data-composition-id="05-benefit"
        data-composition-src="compositions/05-benefit.html"
        data-start="23.5"
        data-duration="4.5"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="el-cta"
        data-composition-id="06-cta"
        data-composition-src="compositions/06-cta.html"
        data-start="28"
        data-duration="5"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      // Root timeline stays empty — all animation lives in the sub-compositions.
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
