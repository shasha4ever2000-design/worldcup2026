<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          background: #14110d;
          font-family: "Archivo Black", "Montserrat", sans-serif;
          color: #f5efe6;
        }

        .card {
          position: absolute;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          text-align: center;
          opacity: 0;
        }
        .card .line {
          font-size: 116px;
          letter-spacing: -0.03em;
          line-height: 1.08;
        }
        .card .accent {
          color: #e07a5f;
        }

        .glow {
          position: absolute;
          left: 50%;
          top: 50%;
          width: 1100px;
          height: 1100px;
          transform: translate(-50%, -50%);
          border-radius: 50%;
          background: radial-gradient(circle, rgba(224, 122, 95, 0.26) 0%, rgba(224, 122, 95, 0) 66%);
          opacity: 0;
        }

        .lockup {
          position: relative;
          display: flex;
          align-items: center;
          gap: 40px;
          font-size: 96px;
          letter-spacing: -0.02em;
          transform: scale(0.6);
          opacity: 0;
        }
        .lockup .x {
          font-family: "Space Mono", monospace;
          font-size: 56px;
          color: #8f80f3;
        }
        .lockup .claude { color: #f5efe6; }
        .lockup .heygen { color: #e07a5f; }

        .tagline {
          margin-top: 32px;
          font-family: "Space Mono", monospace;
          font-size: 30px;
          letter-spacing: 0.04em;
          color: #b8ada0;
          opacity: 0;
        }
        .sub {
          margin-top: 64px;
          font-family: "Space Mono", monospace;
          font-size: 24px;
          letter-spacing: 0.08em;
          color: #948a7d;
          opacity: 0;
        }

        .frame-mark {
          position: absolute;
          bottom: 90px;
          right: 140px;
          font-family: "Space Mono", monospace;
          font-size: 22px;
          letter-spacing: 0.1em;
          color: #948a7d;
        }
      </style>

      <div id="root" data-composition-id="06-cta" data-width="1920" data-height="1080">
        <div class="glow" id="cta-glow"></div>

        <div class="card" id="card-1">
          <div class="line">START CREATING</div>
          <div class="line accent">UNLIMITED VIDEOS</div>
        </div>

        <div class="card" id="card-2">
          <div class="line">WITH CLAUDE <span class="accent">+</span> HEYGEN</div>
          <div class="line accent">TODAY</div>
        </div>

        <div class="card" id="card-3">
          <div class="lockup" id="cta-lockup">
            <span class="claude">CLAUDE</span><span class="x">&times;</span><span class="heygen">HEYGEN</span>
          </div>
          <div class="tagline" id="cta-tagline">powered by the HyperFrames connector</div>
          <div class="sub" id="cta-sub">unlimited AI videos, on request</div>
        </div>

        <div class="frame-mark">06 / CTA</div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        const root = "[data-composition-id='06-cta'] ";

        // Card chain — instant hard cuts at full opacity, each card holds with a
        // barely-perceptible continuous scale-up (the titlecard-reveal card-chain register).
        tl.set(root + "#card-1", { opacity: 1 }, 0);
        tl.fromTo(root + "#card-1", { scale: 1 }, { scale: 1.02, duration: 1.6, ease: "sine.inOut" }, 0);
        tl.set(root + "#card-1", { opacity: 0 }, 1.6);

        tl.set(root + "#card-2", { opacity: 1 }, 1.6);
        tl.fromTo(root + "#card-2", { scale: 1 }, { scale: 1.02, duration: 1.6, ease: "sine.inOut" }, 1.6);
        tl.set(root + "#card-2", { opacity: 0 }, 3.2);

        tl.set(root + "#card-3", { opacity: 1 }, 3.2);
        tl.fromTo(root + "#cta-glow", { opacity: 0, scale: 0.85 }, { opacity: 0.9, scale: 1, duration: 0.7, ease: "sine.out" }, 3.2);
        tl.fromTo(root + "#cta-lockup", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.55, ease: "back.out(1.8)" }, 3.3);
        tl.fromTo(root + "#cta-tagline", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 3.75);
        tl.fromTo(root + "#cta-sub", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 4.0);

        // Subtle breathing on the held final card.
        tl.fromTo(root + "#cta-lockup", { scale: 1 }, { scale: 1.02, duration: 0.9, ease: "sine.inOut", yoyo: true, repeat: 1 }, 4.1);

        tl.fromTo(root + ".frame-mark", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.3);

        window.__timelines["06-cta"] = tl;
      </script>
    </template>
  </body>
</html>
