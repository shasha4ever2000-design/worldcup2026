<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          background: #14110d;
          font-family: "Archivo Black", "Montserrat", sans-serif;
          color: #f5efe6;
        }

        .bg-grid {
          position: absolute;
          inset: 0;
          background-image:
            linear-gradient(rgba(245, 239, 230, 0.05) 1px, transparent 1px),
            linear-gradient(90deg, rgba(245, 239, 230, 0.05) 1px, transparent 1px);
          background-size: 96px 96px;
          opacity: 0.5;
        }

        .glow {
          position: absolute;
          width: 1200px;
          height: 1200px;
          left: 50%;
          top: 50%;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(224, 122, 95, 0.32) 0%, rgba(224, 122, 95, 0) 68%);
          transform: translate(-50%, -50%) scale(1);
          filter: blur(2px);
        }

        .ghost-word {
          position: absolute;
          left: 50%;
          top: 54%;
          transform: translate(-50%, -50%);
          font-size: 420px;
          letter-spacing: -0.02em;
          color: #f5efe6;
          opacity: 0.04;
          white-space: nowrap;
        }

        .chip {
          position: absolute;
          top: 96px;
          left: 140px;
          display: flex;
          align-items: center;
          gap: 18px;
          font-family: "Space Mono", monospace;
          font-size: 24px;
          letter-spacing: 0.08em;
          color: #b8ada0;
          opacity: 0;
        }
        .chip .dot {
          width: 10px;
          height: 10px;
          border-radius: 50%;
          background: #e07a5f;
        }

        .headline {
          position: absolute;
          left: 140px;
          top: 388px;
          width: 1660px;
        }
        .headline .line {
          display: flex;
          overflow: hidden;
          padding: 4px 0;
        }
        .headline .line .word {
          font-size: 132px;
          line-height: 1.02;
          letter-spacing: -0.03em;
          margin-right: 34px;
          opacity: 0;
          transform: translateY(46px);
          white-space: nowrap;
        }
        .headline .line.accent .word {
          color: #e07a5f;
        }

        .underline {
          position: absolute;
          left: 0;
          bottom: -14px;
          height: 10px;
          width: 100%;
          background: #e07a5f;
          transform: scaleX(0);
          transform-origin: left center;
        }
        .line.accent {
          position: relative;
        }

        .caret {
          position: absolute;
          left: 148px;
          top: 668px;
          display: flex;
          align-items: center;
          gap: 20px;
          font-family: "Space Mono", monospace;
          font-size: 30px;
          color: #b8ada0;
          opacity: 0;
        }
        .caret .bar {
          width: 20px;
          height: 40px;
          background: #e07a5f;
        }

        .frame-mark {
          position: absolute;
          bottom: 90px;
          right: 140px;
          font-family: "Space Mono", monospace;
          font-size: 22px;
          letter-spacing: 0.1em;
          color: #948a7d;
          opacity: 0;
        }
      </style>

      <div id="root" data-composition-id="01-hook" data-width="1920" data-height="1080">
        <div class="bg-grid"></div>
        <div class="glow" id="hook-glow"></div>
        <div class="ghost-word" id="hook-ghost">STUDIO</div>

        <div class="chip" id="hook-chip"><span class="dot"></span>CLAUDE &times; HEYGEN &mdash; VIA HYPERFRAMES</div>

        <div class="headline">
          <div class="line" id="hook-line1">
            <span class="word">TURN</span><span class="word">CLAUDE</span><span class="word">INTO</span>
          </div>
          <div class="line accent" id="hook-line2">
            <span class="word">YOUR</span><span class="word">VIDEO</span><span class="word">STUDIO</span>
            <div class="underline" id="hook-underline"></div>
          </div>
        </div>

        <div class="caret" id="hook-caret"><span class="bar" id="hook-bar"></span>ask Claude to make a video&hellip;</div>

        <div class="frame-mark">01 / HOOK</div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        const root = "[data-composition-id='01-hook'] ";

        // Ambient background — persistent, slow breathing glow.
        tl.fromTo(root + "#hook-glow", { scale: 0.85, opacity: 0.5 }, { scale: 1, opacity: 0.85, duration: 4.5, ease: "sine.inOut" }, 0);
        tl.fromTo(root + "#hook-ghost", { x: 0, opacity: 0.03 }, { x: -40, opacity: 0.05, duration: 4.5, ease: "sine.inOut" }, 0);

        // Top identity chip.
        tl.fromTo(root + "#hook-chip", { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.1);

        // Word-by-word staggered arrival — line 1, then line 2 (kinetic-beat-slam pattern).
        const words1 = root + "#hook-line1 .word";
        const words2 = root + "#hook-line2 .word";
        tl.fromTo(
          words1,
          { opacity: 0, y: 46, scale: 0.94 },
          { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.6)", stagger: 0.07 },
          0.25,
        );
        tl.fromTo(
          words2,
          { opacity: 0, y: 46, scale: 0.94 },
          { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.6)", stagger: 0.07 },
          0.55,
        );

        // Accent underline draws under the payoff line.
        tl.fromTo(root + "#hook-underline", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 1.05);

        // Prompt caret line — the "ask Claude" motif.
        tl.fromTo(root + "#hook-caret", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 1.3);

        // Blinking caret bar — deterministic finite square-wave blink (tl.set pairs, seek-safe).
        for (let t = 1.3; t < 4.3; t += 0.4) {
          tl.set(root + "#hook-bar", { opacity: 1 }, t);
          tl.set(root + "#hook-bar", { opacity: 0.15 }, t + 0.2);
        }

        tl.fromTo(root + ".frame-mark", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 1.5);

        window.__timelines["01-hook"] = tl;
      </script>
    </template>
  </body>
</html>
